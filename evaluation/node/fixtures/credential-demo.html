<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diver — Credential Handling Demo</title>
  <style>
    body { max-width: 740px; margin: 40px auto; padding: 0 24px; font: 17px/1.6 system-ui; }
    select, input, button { display: block; font: inherit; padding: 10px; margin: 12px 0; }
    form { padding: 24px; background: #edf3f8; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>Password-handling warnings</h1>
  <p>Leave the password field empty. Normal submission is prevented.</p>
  <label for="method">Declared submission method</label>
  <select id="method"><option value="get">GET</option><option value="post">POST</option></select>
  <form method="get" action="https://127.0.0.1/session">
    <label for="password">Demo password — leave empty</label>
    <input id="password" name="password" type="password" autocomplete="off">
    <button type="submit">Demo submit — prevented</button>
  </form>
  <p>Open Diver. GET should show FORM-GET and FORM-HTTP-PAGE.
    POST should retain only FORM-HTTP-PAGE.</p>
  <script>
    const form = document.querySelector("form");
    document.querySelector("#method").addEventListener("change", event => {
      form.method = event.target.value;
    });
    form.addEventListener("submit", event => event.preventDefault());
  </script>
</body>
</html>
